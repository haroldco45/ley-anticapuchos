[build]
  ignore = "git log -1 --pretty='%an %ae' | grep -qiE 'robot|github-actions'"  # no publicar commits del robot (ahorra créditos)
  publish = "."

[[headers]]
  for = "/data/noticias.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
